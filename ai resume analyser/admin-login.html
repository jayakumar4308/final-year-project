<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | ResumeAI</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .admin-login-page {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            background: #f7f9fc;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.08);
        }

        .admin-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #eef4ff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
        }

        .login-card h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .login-card > p {
            text-align: center;
            color: #70798a;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #dfe4ec;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        .form-group input:focus {
            border-color: #2563eb;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .error-message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: #fee2e2;
            color: #dc2626;
            font-size: 14px;
            text-align: center;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #2563eb;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        ResumeAI
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="upload.html">Analyze Resume</a>
        <a href="jobs.html">Jobs</a>
        <a href="admin-login.html" class="admin-btn">
            Admin Login
        </a>
    </nav>

</header>


<section class="admin-login-page">

    <div class="login-card">

        <div class="admin-icon">
            🔐
        </div>

        <h1>Admin Login</h1>

        <p>
            Sign in to manage ResumeAI
        </p>


        <form id="adminLoginForm">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter admin username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter admin password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                Login to Dashboard
            </button>

        </form>


        <div
            class="error-message"
            id="errorMessage"
        >
            Invalid username or password.
        </div>


        <a
            href="index.html"
            class="back-link"
        >
            ← Back to Home
        </a>

    </div>

</section>


<footer>

    <p>
        © 2026 JKS | AI Resume Analyzer & Job Recommendation System
    </p>

</footer>


<script>

    document
        .getElementById("adminLoginForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            const username =
                document.getElementById("username").value;

            const password =
                document.getElementById("password").value;

            const errorMessage =
                document.getElementById("errorMessage");


            /*
             * TEMPORARY FRONTEND LOGIN
             *
             * Later this will be replaced with
             * Python + MySQL authentication.
             */

            if (
                username === "project" &&
                password === "pro2026"
            ) {

                window.location.href =
                    "admin-dashboard.html";

            } else {

                errorMessage.style.display = "block";

            }

        });

</script>

</body>
</html>
